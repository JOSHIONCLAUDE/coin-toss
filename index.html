<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>₹10 Coin Toss</title>
<meta name="description" content="Click the coin to toss it. Heads or tails?">
<meta name="theme-color" content="#14213d">
<style>
  :root { --gold1:#ffe58a; --gold2:#e6b422; --gold3:#a8770b; --ink:#14213d; --card:rgba(255,255,255,0.08); --line:rgba(255,255,255,0.16); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body { background:radial-gradient(circle at 50% 18%, #2a3f73 0%, #14213d 55%, #0b1326 100%); background-attachment:fixed; color:#fff; font-family:'Segoe UI', system-ui, Arial, sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; user-select:none; -webkit-user-select:none; }
  h1 { margin:6px 0 2px; font-size:clamp(30px, 6vw, 46px); letter-spacing:1px; }
  .sub { margin:0 0 6px; opacity:0.8; }

  #stage { position:relative; width:260px; height:360px; display:flex; align-items:flex-end; justify-content:center; perspective:900px; margin-top:4px; }
  #arc { position:absolute; bottom:70px; left:50%; width:200px; height:200px; margin-left:-100px; }
  #arc.tossing { animation:arc 1.5s cubic-bezier(.3,.1,.5,1) forwards; }
  @keyframes arc { 0% { transform:translateY(0) scale(1); } 45% { transform:translateY(-185px) scale(1.3); } 100% { transform:translateY(0) scale(1); } }
  #shadow { position:absolute; bottom:44px; left:50%; width:150px; height:26px; margin-left:-75px; border-radius:50%; background:rgba(0,0,0,0.5); filter:blur(7px); transform-origin:center; }
  #shadow.tossing { animation:shadow 1.5s cubic-bezier(.3,.1,.5,1) forwards; }
  @keyframes shadow { 0% { transform:scale(1); opacity:0.6; } 45% { transform:scale(0.45); opacity:0.2; } 100% { transform:scale(1); opacity:0.6; } }

  #coin { position:relative; width:200px; height:200px; cursor:pointer; -webkit-transform-style:preserve-3d; transform-style:preserve-3d; touch-action:manipulation; transition:transform 1.5s cubic-bezier(.15,.7,.2,1); outline:none; }
  #coin:focus-visible .face { box-shadow:0 0 0 4px #fff; }
  .face { position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.front { transform:translateZ(6px); }
  .face.back { transform:rotateX(180deg) translateZ(6px); }
  .face svg { width:100%; height:100%; display:block; font-family:'Nirmala UI','Noto Sans Devanagari','Mangal','Segoe UI',system-ui,sans-serif; }
  .edge { position:absolute; inset:0; border-radius:50%; background:linear-gradient(#c9ced2, #7f868c); transform:translateZ(var(--z)); }
  #coin:not(.busy):hover { filter:brightness(1.07); }
  #coin.busy { cursor:default; }
  /* once the coin has landed it is shown flat: only the face that came up is drawn, upright (some phone browsers don't hide the back of a flipped element) */
  #coin.settled.heads .back, #coin.settled.tails .front { display:none; }
  #coin.settled.tails .back { transform:translateZ(6px); }

  #result { min-height:56px; font-size:clamp(28px, 6vw, 40px); font-weight:800; margin-top:4px; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,0.5); }
  #result small { display:block; font-size:16px; font-weight:600; opacity:0.9; margin-top:2px; }
  #hint { opacity:0.7; font-size:14px; margin-top:2px; }

  .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin-top:14px; }
  .lbl { opacity:0.85; font-weight:600; }
  .pill { padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:#fff; font:inherit; cursor:pointer; }
  .pill.on { background:var(--gold2); color:#2b1a00; border-color:var(--gold2); font-weight:700; }
  .pill:active { transform:scale(0.97); }

  #stats { width:min(440px, 100%); margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; text-align:center; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; opacity:0.75; text-transform:uppercase; letter-spacing:0.5px; }
  #bar { height:12px; border-radius:6px; overflow:hidden; margin:12px 0 4px; background:#3b4a73; display:flex; }
  #barH { background:linear-gradient(90deg,#ffd45e,#e6b422); width:50%; transition:width .4s; }
  #barT { background:linear-gradient(90deg,#8ec5ff,#4a90e2); flex:1; }
  .barlbl { display:flex; justify-content:space-between; font-size:12px; opacity:0.75; }
  #hist { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:12px; min-height:26px; }
  .chip { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#2b1a00; }
  .chip.H { background:#ffd45e; } .chip.T { background:#8ec5ff; }
  .chip.hit { box-shadow:0 0 0 2px #4cd964; } .chip.miss { box-shadow:0 0 0 2px #ff5a5a; }
  .foot { display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .foot .pill { font-size:13px; padding:6px 14px; }
  @media (prefers-reduced-motion: reduce) { #arc.tossing, #shadow.tossing { animation-duration:0.4s; } #coin { transition-duration:0.4s; } }
</style>
</head>
<body>
  <h1>₹10 Coin Toss</h1>
  <p class="sub">Click the ₹10 coin to toss it!</p>

  <div id="stage">
    <div id="shadow"></div>
    <div id="arc">
      <div id="coin" role="button" tabindex="0" aria-label="Toss the coin">
        <!-- HEADS: silver ring, golden centre, lion capital -->
        <div class="face front">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="ringF" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#f9fbfc"/><stop offset=".55" stop-color="#c6cbcf"/><stop offset="1" stop-color="#868d94"/></radialGradient>
              <radialGradient id="goldF" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#e0aa24"/><stop offset="1" stop-color="#a8770b"/></radialGradient>
              <filter id="embF" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="0.4" flood-color="#fff3b8" flood-opacity="0.95"/></filter>
              <filter id="embR" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="0.8" stdDeviation="0.3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
              <path id="topArcF" d="M 20 100 A 80 80 0 0 1 180 100"/>
            </defs>
            <circle cx="100" cy="100" r="99" fill="url(#ringF)"/>
            <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="2" stroke-dasharray="1.6 3.4"/>
            <circle cx="100" cy="100" r="70" fill="#767d84"/>
            <circle cx="100" cy="100" r="68" fill="url(#goldF)"/>
            <circle cx="100" cy="100" r="63" fill="none" stroke="rgba(120,70,0,0.45)" stroke-width="1.4" stroke-dasharray="3 3"/>
            <g filter="url(#embR)" fill="#4f545a" font-weight="800" font-size="14">
              <text><textPath href="#topArcF" startOffset="9%">भारत</textPath></text>
              <text text-anchor="end"><textPath href="#topArcF" startOffset="91%" text-anchor="end">INDIA</textPath></text>
            </g>
            <circle cx="15.5" cy="100" r="2.6" fill="#5c6167"/><circle cx="184.5" cy="100" r="2.6" fill="#5c6167"/>
            <g filter="url(#embF)">
              <!-- three lions -->
              <path d="M70 86 Q71 102 76 109 L124 109 Q129 102 130 86 Q115 93 100 94 Q85 93 70 86 Z" fill="#7a4f00"/>
              <path d="M93.0 80.0 L87.2 82.6 L91.3 87.4 L85.0 87.2 L86.6 93.3 L81.0 90.4 L79.8 96.6 L76.0 91.5 L72.2 96.6 L71.0 90.4 L65.4 93.3 L67.0 87.2 L60.7 87.4 L64.8 82.6 L59.0 80.0 L64.8 77.4 L60.7 72.6 L67.0 72.8 L65.4 66.7 L71.0 69.6 L72.2 63.4 L76.0 68.5 L79.8 63.4 L81.0 69.6 L86.6 66.7 L85.0 72.8 L91.3 72.6 L87.2 77.4 Z" fill="#8f6008"/><path d="M141.0 80.0 L135.2 82.6 L139.3 87.4 L133.0 87.2 L134.6 93.3 L129.0 90.4 L127.8 96.6 L124.0 91.5 L120.2 96.6 L119.0 90.4 L113.4 93.3 L115.0 87.2 L108.7 87.4 L112.8 82.6 L107.0 80.0 L112.8 77.4 L108.7 72.6 L115.0 72.8 L113.4 66.7 L119.0 69.6 L120.2 63.4 L124.0 68.5 L127.8 63.4 L129.0 69.6 L134.6 66.7 L133.0 72.8 L139.3 72.6 L135.2 77.4 Z" fill="#8f6008"/>
              <circle cx="76" cy="80" r="9" fill="#b47c10"/><circle cx="124" cy="80" r="9" fill="#b47c10"/>
              <path d="M123.0 72.0 L115.2 75.0 L121.2 80.8 L112.9 80.6 L116.3 88.3 L108.6 84.9 L108.8 93.2 L103.0 87.2 L100.0 95.0 L97.0 87.2 L91.2 93.2 L91.4 84.9 L83.7 88.3 L87.1 80.6 L78.8 80.8 L84.8 75.0 L77.0 72.0 L84.8 69.0 L78.8 63.2 L87.1 63.4 L83.7 55.7 L91.4 59.1 L91.2 50.8 L97.0 56.8 L100.0 49.0 L103.0 56.8 L108.8 50.8 L108.6 59.1 L116.3 55.7 L112.9 63.4 L121.2 63.2 L115.2 69.0 Z" fill="#8f6008"/><circle cx="100" cy="72" r="12.5" fill="#c18915"/>
              <g fill="#3a2400"><circle cx="95" cy="70" r="1.7"/><circle cx="105" cy="70" r="1.7"/><path d="M96.8 76 L103.2 76 L100 80.4 Z"/><circle cx="73" cy="78" r="1.3"/><circle cx="127" cy="78" r="1.3"/></g>
              <path d="M95 83 Q100 86.5 105 83" fill="none" stroke="#3a2400" stroke-width="1.3" stroke-linecap="round"/>
              <!-- abacus with the wheel, bull and horse -->
              <rect x="62" y="109" width="76" height="10" rx="2.5" fill="#6a4300"/>
              <circle cx="100" cy="114" r="4.4" fill="#e9b93a"/>
              <g stroke="#6a4300" stroke-width="0.7"><path d="M100 109.8 V118.2 M95.8 114 H104.2 M97 111 L103 117 M103 111 L97 117"/></g>
              <ellipse cx="78" cy="114.5" rx="6" ry="2.6" fill="#e9b93a"/><ellipse cx="122" cy="114.5" rx="6" ry="2.6" fill="#e9b93a"/>
              <path d="M66 119 Q100 140 134 119 Z" fill="#7a4f00"/>
              <path d="M82 124 Q100 132 118 124" fill="none" stroke="#e9b93a" stroke-width="1" opacity="0.7"/>
              <text x="100" y="152" text-anchor="middle" font-size="12.5" font-weight="800" fill="#5b3a00">सत्यमेव जयते</text>
            </g>
          </svg>
        </div>
        <!-- TAILS: the value -->
        <div class="face back">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="ringB" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#f9fbfc"/><stop offset=".55" stop-color="#c6cbcf"/><stop offset="1" stop-color="#868d94"/></radialGradient>
              <radialGradient id="goldB" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#e0aa24"/><stop offset="1" stop-color="#a8770b"/></radialGradient>
              <filter id="embB" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="0.4" flood-color="#fff3b8" flood-opacity="0.95"/></filter>
              <filter id="embRB" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="0.8" stdDeviation="0.3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
              <path id="topArcB" d="M 20 100 A 80 80 0 0 1 180 100"/>
              <path id="botArcB" d="M 9 100 A 91 91 0 0 0 191 100"/>
            </defs>
            <circle cx="100" cy="100" r="99" fill="url(#ringB)"/>
            <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="2" stroke-dasharray="1.6 3.4"/>
            <circle cx="100" cy="100" r="70" fill="#767d84"/>
            <circle cx="100" cy="100" r="68" fill="url(#goldB)"/>
            <circle cx="100" cy="100" r="63" fill="none" stroke="rgba(120,70,0,0.45)" stroke-width="1.4" stroke-dasharray="3 3"/>
            <g filter="url(#embRB)" fill="#4f545a" font-weight="800" font-size="13">
              <text text-anchor="middle"><textPath href="#topArcB" startOffset="50%" text-anchor="middle">TEN RUPEES</textPath></text>
              <text text-anchor="middle"><textPath href="#botArcB" startOffset="50%" text-anchor="middle">दस रुपये</textPath></text>
            </g>
            <circle cx="15.5" cy="100" r="2.6" fill="#5c6167"/><circle cx="184.5" cy="100" r="2.6" fill="#5c6167"/>
            <g stroke="rgba(120,70,0,0.38)" stroke-width="1.2" id="rays"></g>
            <g filter="url(#embB)">
              <text x="100" y="118" text-anchor="middle" font-size="58" font-weight="900" fill="#6a4300" letter-spacing="-2">₹10</text>
              <text x="100" y="146" text-anchor="middle" font-size="12" font-weight="800" fill="#6a4300" letter-spacing="2">2025</text>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div id="result" aria-live="polite">&nbsp;</div>
  <div id="hint">or press Space</div>

  <div class="row" id="callRow">
    <span class="lbl">Call it:</span>
    <button class="pill on" data-call="">No call</button>
    <button class="pill" data-call="H">Heads 🦁</button>
    <button class="pill" data-call="T">Tails ₹10</button>
  </div>

  <div id="stats">
    <div class="grid">
      <div class="stat"><b id="sH">0</b><span>Heads</span></div>
      <div class="stat"><b id="sT">0</b><span>Tails</span></div>
      <div class="stat"><b id="sN">0</b><span>Tosses</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Streak</span></div>
      <div class="stat"><b id="sWin">0</b><span>Calls right</span></div>
      <div class="stat"><b id="sLose">0</b><span>Calls wrong</span></div>
    </div>
    <div id="bar"><div id="barH"></div><div id="barT"></div></div>
    <div class="barlbl"><span id="pH">Heads 0%</span><span id="pT">Tails 0%</span></div>
    <div id="hist" aria-label="Last tosses"></div>
  </div>

  <div class="foot">
    <button class="pill" id="soundBtn">🔊 Sound on</button>
    <button class="pill" id="resetBtn">Reset stats</button>
  </div>

<script>
'use strict';
const KEY = 'coinTossV1';
let st = { H: 0, T: 0, streakFace: '', streak: 0, win: 0, lose: 0, hist: [], sound: true };
try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw) st = Object.assign(st, raw); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

const $ = id => document.getElementById(id);
const coin = $('coin'), arc = $('arc'), shadow = $('shadow');
let rot = 0, busy = false, call = '';

// edge of the coin: a stack of thin discs so it looks thick when it spins
for (let z = -5; z <= 5; z++) { const e = document.createElement('div'); e.className = 'edge'; e.style.setProperty('--z', z + 'px'); coin.insertBefore(e, coin.firstChild); }

// little rays around the inside of the golden centre on the "₹10" side
(function () {
  const g = document.getElementById('rays'); let d = '';
  for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a); d += 'M' + (100 + c * 52).toFixed(1) + ' ' + (100 + s * 52).toFixed(1) + 'L' + (100 + c * 60).toFixed(1) + ' ' + (100 + s * 60).toFixed(1); }
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); g.appendChild(p);
})();

// fair random: uses the browser's secure random numbers
function flipRandom() { return crypto.getRandomValues(new Uint32Array(1))[0] % 2 === 0 ? 'H' : 'T'; }
function spinsRandom() { return 4 + (crypto.getRandomValues(new Uint32Array(1))[0] % 4); }

// ---------- sound ----------
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!st.sound) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function sfxToss() { tone(300, 0.35, 'triangle', 0.12, 900); tone(2400, 0.08, 'sine', 0.1, 3200, 0.02); }
function sfxLand() { [0, 0.11, 0.2].forEach((d, i) => { tone(3300 - i * 300, 0.4 - i * 0.1, 'sine', 0.13 - i * 0.03, 3100 - i * 300, d); tone(4900 - i * 400, 0.25, 'sine', 0.05, 4700, d); }); }
function sfxWin() { [523, 659, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.13, f, 0.55 + i * 0.1)); }
function sfxLose() { tone(300, 0.35, 'sawtooth', 0.08, 150, 0.55); }

// ---------- toss ----------
let lastTilt = 0;
function noTransition(fn) { coin.style.transition = 'none'; fn(); void coin.offsetWidth; coin.style.transition = ''; }
// show the landed face flat and upright
function settle(face) { noTransition(() => { coin.classList.add('settled', face === 'H' ? 'heads' : 'tails'); coin.style.transform = 'rotateZ(' + lastTilt + 'deg)'; }); }
// go back to the normal 3D pose at the same angle the coin was resting at, ready to spin again
function unsettle() { if (!coin.classList.contains('settled')) return; noTransition(() => { coin.classList.remove('settled', 'heads', 'tails'); coin.style.transform = 'rotateZ(' + lastTilt + 'deg) rotateX(' + rot + 'deg)'; }); }
function toss() {
  if (busy) return;
  busy = true; coin.classList.add('busy'); $('result').innerHTML = '&nbsp;';
  unsettle();
  const face = flipRandom();                       // 'H' or 'T'
  const want = face === 'H' ? 0 : 180;
  rot += 360 * spinsRandom() + ((want - (rot % 360) + 360) % 360);
  const tilt = (Math.random() - 0.5) * 16;
  lastTilt = tilt;
  coin.style.transform = 'rotateZ(' + tilt + 'deg) rotateX(' + rot + 'deg)';
  arc.classList.remove('tossing'); shadow.classList.remove('tossing'); void arc.offsetWidth;
  arc.classList.add('tossing'); shadow.classList.add('tossing');
  audio(); if (ac && ac.state === 'suspended') ac.resume();
  sfxToss();
  setTimeout(() => land(face), 1520);
}
function land(face) {
  arc.classList.remove('tossing'); shadow.classList.remove('tossing');
  sfxLand();
  st[face]++;
  if (st.streakFace === face) st.streak++; else { st.streakFace = face; st.streak = 1; }
  let verdict = '';
  let hit = null;
  if (call) { hit = (call === face); if (hit) { st.win++; verdict = '🎉 You called it!'; sfxWin(); } else { st.lose++; verdict = '😅 Wrong call, try again!'; sfxLose(); } }
  st.hist.unshift({ f: face, h: hit }); st.hist = st.hist.slice(0, 30);
  save(); render();
  $('result').innerHTML = (face === 'H' ? 'HEADS 🦁' : 'TAILS ₹10') + (verdict ? '<small>' + verdict + '</small>' : '');
  settle(face);
  busy = false; coin.classList.remove('busy');
}

// ---------- screen ----------
function render() {
  const n = st.H + st.T;
  $('sH').textContent = st.H; $('sT').textContent = st.T; $('sN').textContent = n;
  $('sStreak').textContent = st.streak; $('sWin').textContent = st.win; $('sLose').textContent = st.lose;
  const ph = n ? Math.round(st.H / n * 100) : 0, pt = n ? 100 - ph : 0;
  $('barH').style.width = (n ? ph : 50) + '%';
  $('pH').textContent = 'Heads ' + ph + '%'; $('pT').textContent = 'Tails ' + pt + '%';
  $('hist').innerHTML = st.hist.map(h => '<span class="chip ' + h.f + (h.h === true ? ' hit' : h.h === false ? ' miss' : '') + '" title="' + (h.f === 'H' ? 'Heads' : 'Tails') + '">' + h.f + '</span>').join('');
  $('soundBtn').textContent = st.sound ? '🔊 Sound on' : '🔇 Sound off';
}
// One way in for each kind of input, so the coin never flips twice from a single action:
//  - mouse / finger click on the coin (the coin is a plain element, so the browser never makes its own click for Space or Enter)
//  - Space or Enter key, once per key press (holding the key does nothing extra)
coin.addEventListener('click', () => toss());
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  const t = e.target;
  if (t !== document.body && t !== coin) return;          // let the other buttons work normally
  e.preventDefault();
  if (e.repeat) return;
  toss();
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && (e.target === coin || e.target === document.body)) e.preventDefault(); });
document.querySelectorAll('#callRow .pill').forEach(b => b.onclick = () => {
  call = b.dataset.call; document.querySelectorAll('#callRow .pill').forEach(x => x.classList.toggle('on', x === b));
});
$('soundBtn').onclick = () => { st.sound = !st.sound; save(); render(); };
$('resetBtn').onclick = () => { if (!confirm('Reset all your coin toss stats?')) return; st = { H: 0, T: 0, streakFace: '', streak: 0, win: 0, lose: 0, hist: [], sound: st.sound }; save(); render(); $('result').innerHTML = '&nbsp;'; };
render();
</script>
</body>
</html>
